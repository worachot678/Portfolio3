<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio | นายวรโชติ เจริญจิตร</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1d4ed8,#38bdf8);
    color:white;
}

/* เมนู */
header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 10%;
    background:rgba(0,0,0,.25);
    backdrop-filter:blur(10px);
    z-index:1000;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-size:18px;
    transition:.3s;
}

nav a:hover{
    color:#7dd3fc;
}

/* หน้าแรก */
.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.hero img{
    width:220px;
    height:220px;
    border-radius:50%;
    border:6px solid white;
    object-fit:cover;
    box-shadow:0 0 30px #38bdf8;
    animation:float 3s ease-in-out infinite;
}

.hero h1{
    margin-top:25px;
    font-size:50px;
}

.hero h2{
    color:#dbeafe;
    margin-top:10px;
}

.hero p{
    margin-top:20px;
    font-size:20px;
    line-height:1.8;
}

/* ปุ่ม */
.buttons{
    margin-top:35px;
}

.btn{
    display:inline-block;
    margin:10px;
    padding:15px 35px;
    background:#38bdf8;
    color:white;
    text-decoration:none;
    border-radius:50px;
    font-size:18px;
    transition:.3s;
}

.btn:hover{
    background:white;
    color:#1d4ed8;
    transform:translateY(-5px);
}

/* Footer */
footer{
    background:#111827;
    text-align:center;
    padding:20px;
}

/* Animation */
@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0);}
}

/* Responsive */
@media(max-width:768px){

header{
    flex-direction:column;
}

nav{
    margin-top:15px;
}

nav a{
    display:inline-block;
    margin:8px;
}

.hero h1{
    font-size:36px;
}

.hero img{
    width:170px;
    height:170px;
}

}

</style>

</head>

<body>

<header>

<div class="logo">
My Portfolio
</div>

<nav>

<a href="index.html">หน้าแรก</a>

<a href="about.html">ประวัติ</a>

<a href="portfolio.html">ผลงาน</a>

<a href="skills.html">ทักษะ</a>

<a href="contact.html">ติดต่อ</a>

</nav>

</header>

<section class="hero">

<div>

<img src="images/profile.jpg" alt="Profile">

<h1>นายวรโชติ เจริญจิตร</h1>

<h2>นักเรียนชั้นมัธยมศึกษาปีที่ 6</h2>

<p>
ยินดีต้อนรับสู่เว็บไซต์ Portfolio ของผม<br>
เว็บไซต์นี้จัดทำขึ้นเพื่อนำเสนอประวัติส่วนตัว ผลงาน และทักษะต่าง ๆ
</p>

<div class="buttons">

<a href="about.html" class="btn">👤 ประวัติ</a>

<a href="portfolio.html" class="btn">💼 ผลงาน</a>

<a href="skills.html" class="btn">💻 ทักษะ</a>

<a href="contact.html" class="btn">📞 ติดต่อ</a>

</div>

</div>

</section>

<footer>

© 2026 Portfolio | นายวรโชติ เจริญจิตร

</footer>

</body>
</html>
