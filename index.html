<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    overflow:hidden;
    background:linear-gradient(135deg,#d8f3dc,#b7e4c7,#95d5b2,#74c69d);
}

/* วงกลมลอย */
.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.3);
    animation:float 15s linear infinite;
}

.circle:nth-child(1){
    width:220px;
    height:220px;
    left:5%;
    top:80%;
    animation-duration:20s;
}

.circle:nth-child(2){
    width:150px;
    height:150px;
    right:10%;
    top:90%;
    animation-duration:18s;
}

.circle:nth-child(3){
    width:280px;
    height:280px;
    left:75%;
    top:75%;
    animation-duration:25s;
}

@keyframes float{
    0%{
        transform:translateY(0);
    }
    100%{
        transform:translateY(-120vh) rotate(360deg);
    }
}

/* เมนู */

header{
    position:fixed;
    width:100%;
    top:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    background:rgba(255,255,255,.2);
    backdrop-filter:blur(15px);
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#1b4332;
}

nav a{
    color:#1b4332;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;
    transition:.3s;
}

nav a:hover{
    color:#2d6a4f;
}

/* กล่องหลัก */

.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:420px;
    padding:40px;
    text-align:center;
    background:rgba(255,255,255,.25);
    backdrop-filter:blur(20px);
    border-radius:30px;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
    animation:show 1.5s;
}

@keyframes show{

from{
opacity:0;
transform:translateY(50px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.card img{
    width:180px;
    height:180px;
    border-radius:50%;
    object-fit:cover;
    border:6px solid white;
    animation:updown 3s ease-in-out infinite;
}

@keyframes updown{

0%{
transform:translateY(0);
}

50%{
transform:translateY(-12px);
}

100%{
transform:translateY(0);
}

}

.card h1{
    color:#1b4332;
    margin-top:20px;
    font-size:38px;
}

.card h3{
    color:#2d6a4f;
    margin-top:10px;
}

.card p{
    color:#344e41;
    margin-top:20px;
    line-height:1.8;
}

.buttons{
    margin-top:30px;
}

.btn{
    display:inline-block;
    margin:8px;
    padding:13px 28px;
    background:#52b788;
    color:white;
    text-decoration:none;
    border-radius:40px;
    transition:.3s;
}

.btn:hover{
    background:#40916c;
    transform:scale(1.08);
}

footer{
    position:absolute;
    bottom:15px;
    width:100%;
    text-align:center;
    color:#2d6a4f;
}

@media(max-width:768px){

.card{
    width:90%;
}

header{
    flex-direction:column;
}

nav{
    margin-top:15px;
}

}

</style>

</head>

<body>

<div class="circle"></div>
