<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio | นายวรโชติ เจริญจิตร</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
.page-nav{
    margin:40px auto;
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.page-nav a{
    display:inline-block;
    padding:12px 30px;
    background:#52b788;
    color:white;
    text-decoration:none;
    border-radius:40px;
    transition:.3s;
    font-weight:600;
    box-shadow:0 8px 20px rgba(82,183,136,.3);
}

.page-nav a:hover{
    background:#2d6a4f;
    transform:translateY(-5px);
    box-shadow:0 12px 25px rgba(45,106,79,.4);
}
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#e8fff2,#d8f3dc,#b7e4c7,#95d5b2);
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

/* วงกลมพื้นหลัง */

.circle{
position:absolute;
border-radius:50%;
background:rgba(255,255,255,.35);
animation:move 12s infinite alternate;
}

.c1{
width:260px;
height:260px;
top:-70px;
left:-70px;
}

.c2{
width:180px;
height:180px;
bottom:50px;
right:80px;
animation-duration:15s;
}

.c3{
width:120px;
height:120px;
top:120px;
right:250px;
animation-duration:10s;
}

@keyframes move{

from{
transform:translateY(0) translateX(0);
}

to{
transform:translateY(-40px) translateX(30px);
}

}

/* เมนู */

header{
position:absolute;
top:0;
left:0;
width:100%;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:30px;
font-weight:700;
color:#2d6a4f;
}

nav a{
text-decoration:none;
margin-left:20px;
font-weight:500;
color:#2d6a4f;
transition:.3s;
}

nav a:hover{
color:#40916c;
}

/* กล่อง */

.card{

width:430px;
padding:40px;
text-align:center;

background:rgba(255,255,255,.35);

backdrop-filter:blur(18px);

border-radius:30px;

box-shadow:0 20px 40px rgba(0,0,0,.15);

}

/* รูป */

.card img{

width:180px;
height:180px;
object-fit:cover;
border-radius:50%;
border:6px solid white;
box-shadow:0 0 25px #52b788;

animation:float 3s ease-in-out infinite;

}

@keyframes float{

0%{
transform:translateY(0);
}

50%{
transform:translateY(-10px);
}

100%{
transform:translateY(0);
}

}

.card h1{

margin-top:20px;
color:#1b4332;
font-size:35px;

}

.card h3{

margin-top:10px;
color:#2d6a4f;

}

.card p{

margin-top:20px;
line-height:1.8;
color:#344e41;

}

/* ปุ่ม */

.buttons{

margin-top:30px;

}

.btn{

display:inline-block;
margin:8px;
padding:12px 28px;

background:#52b788;

color:white;

text-decoration:none;

border-radius:40px;

transition:.3s;

}

.btn:hover{

background:#2d6a4f;

transform:translateY(-5px);

box-shadow:0 10px 20px rgba(82,183,136,.5);

}

/* คลื่น */

.wave{

position:absolute;

bottom:0;

width:100%;

height:120px;

background:rgba(255,255,255,.45);

border-radius:100% 100% 0 0;

}

/* footer */

footer{

position:absolute;

bottom:15px;

width:100%;

text-align:center;

color:#2d6a4f;

font-size:14px;

}

/* มือถือ */

@media(max-width:768px){

header{

flex-direction:column;

}

nav{

margin-top:15px;

}

nav a{

display:inline-block;

margin:8px;

}

.card{

width:90%;

padding:25px;

}

.card h1{

font-size:28px;

}

.card img{

width:150px;
height:150px;

}

}

</style>

</head>

<body>

<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>

<div class="logo">

🌿 My Portfolio

</div>

</nav>

</header>

<div class="card">

<img src="images/profile.jpg">

<h1>นายวรโชติ เจริญจิตร</h1>

<p>

</div>

</div>

<div class="wave"></div>

<footer>

© 2026 Portfolio | นายวรโชติ เจริญจิตร

</footer>

</body>
</html>
