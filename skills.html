<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#e8fff2,#d8f3dc,#b7e4c7,#95d5b2);
min-height:100vh;
overflow-x:hidden;
}

.circle{
position:fixed;
border-radius:50%;
background:rgba(255,255,255,.35);
z-index:-1;
animation:move 12s infinite alternate;
}

.c1{
width:220px;
height:220px;
top:-60px;
left:-60px;
}

.c2{
width:180px;
height:180px;
bottom:40px;
right:60px;
}

@keyframes move{
from{transform:translateY(0);}
to{transform:translateY(-40px) translateX(30px);}
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:rgba(255,255,255,.25);
backdrop-filter:blur(15px);
position:sticky;
top:0;
}

.logo{
font-size:28px;
font-weight:bold;
color:#2d6a4f;
}

nav a{
text-decoration:none;
margin-left:20px;
color:#2d6a4f;
font-weight:500;
transition:.3s;
}

nav a:hover{
color:#40916c;
}

.container{
width:90%;
max-width:900px;
margin:50px auto;
background:rgba(255,255,255,.35);
backdrop-filter:blur(15px);
padding:40px;
border-radius:25px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.container h1{
text-align:center;
color:#1b4332;
margin-bottom:10px;
}

.container p{
text-align:center;
color:#344e41;
margin-bottom:35px;
}

.skill{
margin-bottom:25px;
}

.skill-name{
display:flex;
justify-content:space-between;
margin-bottom:8px;
font-weight:600;
color:#1b4332;
}

.bar{
width:100%;
height:16px;
background:#d8f3dc;
border-radius:30px;
overflow:hidden;
}

.fill{
height:100%;
background:#52b788;
border-radius:30px;
}

.html{width:90%;}
.css{width:85%;}
.office{width:95%;}
.canva{width:90%;}
.team{width:88%;}

.page-nav{
margin:40px auto 10px;
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

.page-nav a{
padding:12px 30px;
background:#52b788;
color:white;
text-decoration:none;
border-radius:40px;
font-weight:600;
transition:.3s;
box-shadow:0 8px 20px rgba(82,183,136,.3);
}

.page-nav a:hover{
background:#2d6a4f;
transform:translateY(-5px);
}

footer{
text-align:center;
padding:20px;
color:#2d6a4f;
}

@media(max-width:768px){

header{
flex-direction:column;
}

nav{
margin-top:15px;
}

nav a{
display:inline-block;
margin:8px;
}

.container{
padding:25px;
}

}

</style>

</head>

<body>

<div class="circle c1"></div>
<div class="circle c2"></div>

<header>

<div class="logo">
🌿 My Portfolio
</div>

<nav>

<a href="index.html">หน้าแรก</a>
<a href="about.html">ประวัติ</a>
<a href="portfolio.html">ผลงาน</a>
<a href="skills.html">ทักษะ</a>
<a href="contact.html">ติดต่อ</a>

</nav>

</header>

<div class="container">

<h1>ทักษะของฉัน</h1>

<p>ความสามารถที่ได้เรียนรู้และพัฒนา</p>

<div class="skill">
<div class="skill-name">
<span>HTML</span>
<span>90%</span>
</div>
<div class="bar">
<div class="fill html"></div>
</div>
</div>

<div class="skill">
<div class="skill-name">
<span>CSS</span>
<span>85%</span>
</div>
<div class="bar">
<div class="fill css"></div>
</div>
</div>

<div class="skill">
<div class="skill-name">
<span>Microsoft Office</span>
<span>95%</span>
</div>
<div class="bar">
<div class="fill office"></div>
</div>
</div>

<div class="skill">
<div class="skill-name">
<span>Canva</span>
<span>90%</span>
</div>
<div class="bar">
<div class="fill canva"></div>
</div>
</div>

<div class="skill">
<div class="skill-name">
<span>การทำงานเป็นทีม</span>
<span>88%</span>
</div>
<div class="bar">
<div class="fill team"></div>
</div>
</div>

</div>

<div class="page-nav">

<a href="portfolio.html">⬅ ผลงาน</a>

<a href="index.html">🏠 หน้าแรก</a>

<a href="contact.html">ติดต่อ ➜</a>

</div>

<footer>

</footer>

</body>
</html>
