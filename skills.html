<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills | Portfolio</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    color:white;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 10%;
    background:rgba(0,0,0,.3);
    backdrop-filter:blur(10px);
}

.logo{
    font-size:28px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    transition:.3s;
}

nav a:hover{
    color:#38bdf8;
}

.container{
    width:85%;
    margin:60px auto;
}

.title{
    text-align:center;
    margin-bottom:40px;
}

.title h1{
    font-size:42px;
}

.title p{
    margin-top:10px;
    color:#d1d5db;
}

.skill-box{
    background:rgba(255,255,255,.1);
    backdrop-filter:blur(10px);
    padding:25px;
    margin-bottom:25px;
    border-radius:15px;
    box-shadow:0 10px 20px rgba(0,0,0,.3);
    transition:.3s;
}

.skill-box:hover{
    transform:translateY(-5px);
}

.skill-name{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:20px;
}

.bar{
    width:100%;
    height:15px;
    background:#334155;
    border-radius:20px;
    overflow:hidden;
}

.fill{
    height:100%;
    border-radius:20px;
    background:#38bdf8;
}

.html{width:90%;}
.css{width:85%;}
.office{width:95%;}
.canva{width:90%;}
.team{width:88%;}

.back{
    text-align:center;
    margin-top:40px;
}

.back a{
    display:inline-block;
    padding:14px 35px;
    background:#38bdf8;
    color:white;
    text-decoration:none;
    border-radius:50px;
    transition:.3s;
}

.back a:hover{
    background:white;
    color:#1e40af;
}

footer{
    text-align:center;
    background:#111827;
    padding:20px;
    margin-top:50px;
}

@media(max-width:768px){

header{
    flex-direction:column;
}

nav{
    margin-top:15px;
}

nav a{
    display:inline-block;
    margin:8px;
}

.title h1{
    font-size:34px;
}

}

</style>

</head>

<body>

<header>

<div class="logo">
My Portfolio
</div>

<nav>

<a href="about.html">ประวัติ</a>

<a href="contact.html">ติดต่อ</a>
</nav>

</header>

<p>ความสามารถและทักษะที่ได้เรียนรู้</p>
</div>

<div class="skill-box">

<div class="skill-name">
<span>HTML</span>
<span>90%</span>
</div>

<div class="bar">
<div class="fill html"></div>
</div>

</div>

</div>

</div>

</div>

<div class="skill-box">

<div class="skill-name">
<span>Microsoft Office</span>
<span>95%</span>
</div>

<div class="bar">
<div class="fill office"></div>
</div>

</div>

<div class="skill-box">

<div class="skill-name">
<span>Canva</span>
<span>90%</span>
</div>

<div class="bar">
<div class="fill canva"></div>
</div>

</div>

<div class="skill-box">

<div class="skill-name">
<span>การทำงานเป็นทีม</span>
<span>88%</span>
</div>

<div class="bar">
<div class="fill team"></div>
</div>

</div>

<div class="back">

<a href="index.html">
← กลับหน้าแรก
</a>

</div>

</div>
<div class="page-nav">

</div>
<footer>

</body>
</html>
